<div class="flex sm:flex-row flex-col sm:justify-between sm:items-center items-start sm:gap-0 gap-y-2.5 mb-5">
  <h3 class="text-2xl">Course/Training Program</h3>
  <p-button
    (onClick)="showDrawer = true"
    icon="pi pi-plus"
    label="Add Course"
    severity="contrast"
    styleClass="px-3 py-2"
    variant="outlined"
  />
</div>

<p-card>
  <p-table
    [loading]="dataService.loading$ | async"
    [paginator]="false"
    [showLoader]="false"
    [value]="(dataService.course$ | async) ?? []"
    responsiveLayout="scroll"
    styleClass="p-datatable-striped"
  >
    <ng-template pTemplate="loadingbody">
      <tr *appRepeat="15">
        <td *appRepeat="6">
          <p-skeleton />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Timezone</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template let-course pTemplate="body">
      <tr>
        <td>
          <a [routerLink]="course.id" class="text-primary font-semibold">
            {{ course.name }}
          </a>
        </td>
        <td>{{ course.description }}</td>
        <td>{{ course.timezone }}</td>
        <td class="flex gap-3">
          <p-button
            (onClick)="editCourse(course)"
            [outlined]="true"
            icon="pi pi-pencil"
            severity="contrast"
            styleClass="action-button"
            variant="outlined"
          />
          <p-button
            (click)="onDelete(course)"
            [outlined]="true"
            icon="pi pi-trash"
            severity="danger"
            styleClass="action-button"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">
          <app-no-data />
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-drawer
  [(visible)]="showDrawer"
  [header]="selectedCourse ? 'Edit Course' : 'Create Course'"
  blockScroll="true"
  closeOnEscape="false"
  dismissible="false"
  position="right"
  styleClass="w-full md:w-[500px]"
>
  <app-add-edit-course (onClose)="onDrawerClose()" *ngIf="showDrawer" [course]="selectedCourse" />
</p-drawer>
