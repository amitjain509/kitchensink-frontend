<h1 mat-dialog-title>Add Role</h1>
<div></div>
<div mat-dialog-content class="role-permission">
    <form [formGroup]="rolePermissionForm">
        <mat-form-field appearance="outline">
            <mat-label>Role Name</mat-label>
            <input matInput formControlName="roleName">
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="roleDescription"></textarea>
        </mat-form-field>
    </form>
</div>

<div mat-dialog-actions [align]="'end'">
    <button mat-raised-button color="warn" mat-dialog-close>Close</button>
    <button mat-raised-button color="primary" (click)="linkPermission()">Save</button>
</div>
