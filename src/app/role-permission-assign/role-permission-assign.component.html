<mat-card>
    <mat-toolbar color="primary" class="header-bar" style="background-color: #004780; color: white;">
        <span>Permission Assignment</span>
    </mat-toolbar>
    <div style="margin-top: 2%;"></div>
    <!-- Role Selection Dropdown -->
    <mat-form-field appearance="outline" class="role-dropdown">
        <mat-label>Select Role</mat-label>
        <mat-select (selectionChange)="onRoleChange($event.value)">
            <mat-option *ngFor="let role of roles" [value]="role.roleId">
                {{ role.roleName }}
            </mat-option>
        </mat-select>
    </mat-form-field>

    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource">

            <!-- Permission Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Permission Name</th>
                <td mat-cell *matCellDef="let element">{{ element.name }}</td>
            </ng-container>

            <!-- Is Assigned (Checkbox) Column -->
            <ng-container matColumnDef="isAssigned">
                <th mat-header-cell *matHeaderCellDef>Assigned</th>
                <td mat-cell *matCellDef="let element; let i = index">
                    <ng-container *ngIf="permissionsArray.controls[i] as control">
                      <mat-checkbox [formControl]="$any(control)" (change)="onCheckboxChange(i)">
                      </mat-checkbox>
                    </ng-container>
                  </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['name', 'isAssigned']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['name', 'isAssigned'];"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
        </mat-paginator>
    </div>
    <div class="save-button-container">
        <button mat-raised-button color="primary" (click)="linkPermission()" [disabled]="!selectedRole">
            Save
        </button>
    </div>
</mat-card>
