<mat-toolbar color="primary" class="mat-elevation-z8">
    <span>Kitchensink Quickstart</span>
</mat-toolbar>
<mat-drawer-container class="navigation-bar">
    <mat-drawer #drawer opened="true" mode="side" position="start">
        <mat-nav-list>
            <mat-list-item>
                <button routerLink="profile" mat-button [class.active]="isRouteActive('profile')">
                    <mat-icon>home</mat-icon> Home
                </button>
            </mat-list-item>
            <div *ngIf="hasPermission('USER_VIEW')">
                <mat-divider></mat-divider>
                <mat-list-item>
                    <button (click)="navigateToUsers('USER')" mat-button [class.active]="isRouteActive('users')">
                        <mat-icon>supervisor_account</mat-icon>Users
                    </button>
                </mat-list-item>
            </div>
            <!-- <mat-list-item>
                <button (click)="navigateToUsers('MEMBER')"
                    mat-button><mat-icon>supervised_user_circle</mat-icon>Members</button>
            </mat-list-item>
            <mat-divider></mat-divider> -->
            <!-- Access Control with Submenu -->
            <div *ngIf="hasPermission('ROLE_VIEW')">
                <mat-divider></mat-divider>
                <mat-expansion-panel [expanded]="isAccessControlExpanded()">
                    <mat-expansion-panel-header>
                        <mat-panel-title [class.active]="isAccessControlExpanded()">
                            <mat-icon>security</mat-icon> Access Control
                        </mat-panel-title>
                    </mat-expansion-panel-header>
                    <mat-list>
                        <mat-list-item>
                            <button routerLink="roles" mat-button [class.active]="isRouteActive('roles')">
                                Roles
                            </button>
                        </mat-list-item>
                        <mat-divider></mat-divider>
                        <mat-list-item>
                            <button routerLink="permission-assign" mat-button
                                [class.active]="isRouteActive('permission-assign')">
                                Permissions
                            </button>
                        </mat-list-item>

                    </mat-list>
                </mat-expansion-panel>
            </div>

            <div class="logout-container">
                <mat-divider></mat-divider>
                <mat-list-item>
                    <button mat-button color="warn" (click)="logout()">
                        <mat-icon>logout</mat-icon> Logout
                    </button>
                </mat-list-item>
            </div>
        </mat-nav-list>
    </mat-drawer>
    <mat-drawer-content>
        <div style="text-align: center;min-height: 600px;">
            <router-outlet></router-outlet>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
