<h1 mat-dialog-title>{{dialogTitle}}</h1>
<div></div>
<div mat-dialog-content class="user-dialog-content">
    <form [formGroup]="userForm">
        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input formControlName="name" matInput placeholder="Name">
            <mat-error *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched">
                <span *ngIf="userForm.get('name')?.hasError('required')">Name is required.</span>
                <span *ngIf="userForm.get('name')?.hasError('minlength')">Minimum 3 characters required.</span>
                <span *ngIf="userForm.get('name')?.hasError('maxlength')">Maximum 50 characters allowed.</span>
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input formControlName="email" matInput placeholder="Email">
            <mat-error *ngIf="userForm.get('email')?.hasError('required')">
                Email is required.
              </mat-error>
              <mat-error *ngIf="userForm.get('email')?.hasError('email')">
                Please enter a valid email address.
              </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input formControlName="phoneNumber" matInput placeholder="Phone Number">
            <mat-error *ngIf="userForm.get('phoneNumber')?.hasError('required')">
                Phone Number is required.
              </mat-error>
              <mat-error *ngIf="userForm.get('phoneNumber')?.hasError('pattern')">
                Please enter a valid phone number.
              </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Role</mat-label>
            <mat-select formControlName="role">
                <mat-option *ngFor="let role of roles" [value]="role.roleId">
                    {{ role.roleName }}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </form>
</div>

<div mat-dialog-actions [align]="'end'">
    <button mat-raised-button color="warn" mat-dialog-close>Close</button>
    <button mat-raised-button color="primary" (click)="addUser()">Save</button>
</div>
